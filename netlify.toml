[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Routes that changed in the rebuild. 301 so search engines move the ranking.
[[redirects]]
  from = "/ventures/portfolio"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/ventures"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/news"
  to = "/media"
  status = 301
  force = true

[[redirects]]
  from = "/press"
  to = "/media"
  status = 301
  force = true

[[redirects]]
  from = "/members"
  to = "/team"
  status = 301
  force = true

[[redirects]]
  from = "/funding"
  to = "/work"
  status = 301
  force = true

# Credo is offline while it is rewritten. Restore this route when it returns.
[[redirects]]
  from = "/credo"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/work/institute"
  to = "/work/coexisting-with-ai"
  status = 301
  force = true

[[redirects]]
  from = "/work/ai-skepticism"
  to = "/work/coexisting-with-ai"
  status = 301
  force = true

[[redirects]]
  from = "/work/coexisting-with-ai/senate-2017"
  to = "/senate-2017"
  status = 301
  force = true

[[redirects]]
  from = "/work/senate-2017"
  to = "/senate-2017"
  status = 301
  force = true

[[redirects]]
  from = "/leadership"
  to = "/team"
  status = 301
  force = true
